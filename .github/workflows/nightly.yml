name: nightly-shopify-catalogue
on:
  schedule:
    - cron: '20 0 * * *'   # main pass, just after the Worker's UTC day rolls over
    - cron: '20 6 * * *'   # picks up anything left / retries
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  fetch:
    # 3 parallel runners = 3 separate IPs, each paced at 1 req/s; the Worker hands each its own
    # slice of merchants (rowid % 3), so nothing is fetched twice.
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2] }
    concurrency: { group: shopify-catalogue-${{ matrix.shard }}, cancel-in-progress: false }
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node fetch.mjs
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          MAX_MINUTES: '330'
          SHARD: ${{ matrix.shard }}
          SHARDS: '3'
          GAP_MS: '1000'
