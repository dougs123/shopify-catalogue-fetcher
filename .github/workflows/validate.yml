name: Validate catalogue fetchers
on:
  push:
    branches: [main]
    paths: ['*.mjs', 'package.json', '.github/workflows/validate.yml']
  pull_request:
    paths: ['*.mjs', 'package.json', '.github/workflows/validate.yml']
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
